<!-- Dux Connect: a phone mirrored on a desktop screen; lavender body with a 3px mid-tone rim just inside the outline. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="80" y1="-800" x2="880" y2="-160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F0FF"/><stop offset="1" stop-color="#D0BCFF"/>
    </linearGradient>
    <rect id="screen" x="80" y="-800" width="800" height="540" rx="64"/>
    <!-- A mask, not a clip-path: QtSvg ignores clip-path. It keeps the inner half of the rim stroke. -->
    <mask id="in-screen" maskUnits="userSpaceOnUse" x="0" y="-960" width="960" height="960"><use href="#screen" fill="#fff"/></mask>
  </defs>
  <g transform="translate(-5.333 69.333) scale(0.077778)">
    <rect x="430" y="-300" width="100" height="90" fill="#6B4FB8"/>
    <rect x="270" y="-230" width="420" height="70" rx="35" fill="#9F7AEA"/>
    <use href="#screen" fill="url(#body)" stroke="#9F7AEA" stroke-width="77.2" mask="url(#in-screen)"/>
    <rect x="360" y="-738" width="240" height="416" rx="46" fill="#9F7AEA"/>
    <rect x="386" y="-712" width="188" height="326" rx="20" fill="#F5F0FF"/>
    <rect x="448" y="-361" width="64" height="14" rx="7" fill="#F5F0FF"/>
  </g>
</svg>
